<!DOCTYPE html>
<html lang="en">
        
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" class="stylesheet">
</head> 
        
<body>  
    <input id="urlInput" placeholder="https://example.com">
    <button id="scrapeButton">Scrape</button>
    <pre id="result"></pre>
</body> 
<script>
    document.querySelector("#scrapeButton").addEventListener("click", async () => {
        const url = document.querySelector("#urlInput").value;
        const result = document.querySelector("#result");
        result.textContent = "Loading...";

        try {
            const response = await fetch(`/scrape?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "The request failed.");
            }

            result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            result.textContent = error.message;
        }
    }); 
</script>
        
</html>
